services:
  backend:
    build:
      context: ./backend_files
    container_name: superkart-backend
    ports:
      - "7860:7860"
    networks:
      - superkart-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend_files
    container_name: superkart-frontend
    ports:
      - "7861:7861"
    environment:
      - BACKEND_URL=http://backend:7860
    depends_on:
      - backend
    networks:
      - superkart-network
    restart: unless-stopped

networks:
  superkart-network:
    driver: bridge
